<!doctype html>
<!--
  yRDP's own viewer — the HUMAN half of the dual-viewport contract.

  This exists instead of noVNC's stock `vnc.html` for one structural reason and
  several cosmetic ones. The structural one: `vnc.html` ships a control bar, a
  settings drawer and a connect dialog, all of which can RESIZE THE SESSION.
  `resizeSession` is a user-visible toggle there, and a human who flips it turns
  a `--scaled` attach into an `--adopt` silently, invalidating every coordinate
  the agent lane holds. Here the SetDesktopSize pseudo-encoding is never
  advertised at all, so the far end cannot be resized by a viewer even in
  principle — the geometry contract is enforced by omission, which is the only
  way it stays enforced (docs/agent-surface-attachment.md §3).

  THE SHAPE (2026-09-21, refined the same day): ONE page, TWO roles, split by
  the hash. The SIDEBAR (this page at #/) is the remote control — a complex
  sidebar in the ydesign sense: a glass pane on TOP carrying the human controls
  (screenshot, keyboard passthrough, auto-scaling), and under it the machine
  rows, named after machines. The VIEWPORT (this page at #/m/<machine>) shows
  the desktop BARE — no bar, no pane, no chrome: vertical real estate in a
  viewport is expensive and none of it is the sidebar's to spend. The two
  copies talk through the daemon: a row click moves the daemon's active-machine
  pointer, the viewport follows it, and the toggles write viewer prefs the
  viewport applies. The daemon is the truth; both pages are thin — the
  emacsclient model the architecture already prescribes. No control ever
  renegotiates the framebuffer.

  Everything is driven by query parameters so that one file serves every target
  and the Python side owns the policy.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>yRDP</title>
<style>
  /* The yggui base token family, as inherited through ydesign's chain. The
     sidebar is chrome and lives on paper; the session backdrop stays the
     operator's matte (?bg=) so an unfilled viewport reads as an inset panel,
     not as a broken render. */
  :root {
    --paper: #f7f8f8;
    --ink: #24343b;
    --muted: #52666f;
    --accent: #265f63;
    --tint: color-mix(in srgb, var(--accent) 8%, var(--paper));
    --line: color-mix(in srgb, var(--accent) 23%, var(--paper));
    --control-line: color-mix(in srgb, var(--muted) 48%, var(--paper));
    --mark: color-mix(in srgb, var(--accent) 14%, var(--paper));
    /* Overridden from ?bg= so the matte matches the operator's terminal theme
       rather than announcing itself as a different application. */
    --matte: #262a33;
    --edge: rgba(255, 255, 255, .06);
    /* The glass: a barely-there tint over real blur. Frosted LIGHT, so it
       stays readable over whatever sits behind it, and it reads as the
       sidebar's own chrome, not as an overlay parked on the content. */
    --glass: rgba(252, 252, 252, .72);
    --glass-line: rgba(36, 52, 59, .12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--paper);
    overflow: hidden;
    /* The viewer is a viewport, not a document: no rubber-banding, no
       accidental text selection when a drag misses the canvas. */
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    font: 13px/1.5 system-ui, sans-serif;
    color: var(--ink);
  }
  body[data-view="session"] { background: var(--matte); }
  /* The `display` set on #screen/#pane would beat the UA's [hidden] rule and
     leave an invisible layer parked over the startpage, eating every click —
     measured in the browser, not guessed. State beats layout explicitly. */
  #screen[hidden], #pane[hidden] { display: none; }

  /* ── The glass pane — the sidebar's top strip, the remote control ─────── */
  #pane {
    position: absolute; inset: 0 0 auto 0; z-index: 10;
    display: flex; flex-direction: column; gap: 7px;
    padding: 9px 12px 10px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(16px) saturate(1.3);
    backdrop-filter: blur(16px) saturate(1.3);
    border-bottom: 1px solid var(--glass-line);
  }
  .pane-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #pane .pane-title { font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
  #pane .pane-sub {
    color: var(--muted); font-size: 12px; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #pane .controls { display: flex; align-items: center; gap: 8px; }
  #pane .controls .toggle { flex: 1; justify-content: space-between; }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; flex: none;
    border: 1px solid var(--control-line); border-radius: 8px;
    background: transparent; color: var(--ink);
    font: inherit; cursor: pointer; padding: 0;
  }
  .icon-btn:hover:not(:disabled) { background: var(--tint); border-color: var(--accent); }
  .icon-btn:disabled { opacity: .45; cursor: default; }
  .icon-btn svg { display: block; }

  /* Toggle controls: a label plus a real switch. The switch is the yggui
     pattern — pill, round thumb, accent when pressed — and `aria-pressed` is
     the state, not a class name. */
  .toggle {
    display: inline-flex; align-items: center; gap: 7px;
    height: 30px; padding: 0 10px 0 12px;
    border: 1px solid var(--control-line); border-radius: 8px;
    background: transparent; color: var(--ink);
    font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .toggle:hover:not(:disabled) { border-color: var(--accent); }
  .toggle:disabled { opacity: .45; cursor: default; }
  .toggle .switch {
    display: inline-flex; align-items: center;
    width: 30px; height: 17px; padding: 2px; border-radius: 999px;
    background: color-mix(in srgb, var(--muted) 55%, var(--paper));
    transition: background .15s ease; flex: none;
  }
  .toggle .thumb {
    width: 13px; height: 13px; border-radius: 50%; background: var(--paper);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
    transition: transform .15s ease;
  }
  .toggle[aria-pressed="true"] .switch { background: var(--accent); }
  .toggle[aria-pressed="true"] .thumb { transform: translateX(13px); }

  /* Quiet 10px chips, the ydesign way: language AND position, never a badge. */
  .chip {
    font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); border: 1px solid var(--line);
    padding: 1px 7px; border-radius: 999px; white-space: nowrap;
  }
  .chip[data-live="1"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--paper)); }

  /* ── The sidebar's machine rows: hairlines, never cards ───────────────── */
  #page {
    position: absolute; inset: 0; overflow-y: auto;
    /* The pane floats over the page; the first rows scroll beneath it. */
    padding-top: 76px;
  }
  .group-label {
    padding: 12px 16px 6px;
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted);
  }
  .rows { border-top: 1px solid var(--line); }
  .machine-row {
    display: grid; grid-template-columns: 32px 1fr auto auto; gap: 12px;
    align-items: center; padding: 10px 10px 10px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer; background: transparent; width: 100%;
    font: inherit; text-align: left; color: inherit;
    border-left: none; border-right: none; border-top: none;
  }
  /* Rows separated by hairlines, never cards; hover is a tint, not a box. */
  .machine-row:hover { background: var(--tint); }
  .machine-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .machine-row[data-active="1"] .m-title { color: var(--accent); }
  .mark {
    width: 32px; height: 32px; border-radius: 8px;
    display: grid; place-items: center;
    background: var(--mark);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent);
    color: var(--accent); font-weight: 700; font-size: 14px;
  }
  .machine-row .m-title { font-weight: 600; }
  .machine-row .m-sub {
    color: var(--muted); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* The open-here affordance: the sidebar is the remote control, but a copy
     of this page with no viewport beside it still needs a way in. */
  .open-here {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 7px;
    border: 1px solid var(--control-line); background: transparent;
    color: var(--muted); cursor: pointer; padding: 0; font: inherit;
  }
  .open-here:hover { color: var(--accent); border-color: var(--accent); background: var(--tint); }

  /* The empty state: a left-rule quiet block with a bolded first line and an
     escape route — kept context, not catastrophe. */
  .empty {
    margin: 26px 16px; padding: 4px 0 4px 14px;
    border-left: 3px solid var(--line);
  }
  .empty b { display: block; }
  .empty span { color: var(--muted); font-size: 12px; }

  /* ── The session surface — the viewport's whole world, no chrome ──────── */
  /* THE GPU PATH. The canvas noVNC paints into is scaled with a CSS transform,
     which WebKit promotes to a composited layer only if we ask plainly. Without
     these the scale is redone on the CPU every frame and a 1440x1200 surface
     visibly tears while dragging a window. */
  #screen {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    transform: translateZ(0);
    will-change: transform;
    backface-visibility: hidden;
    /* `layout paint`, NOT `strict`. `strict` also applies SIZE containment, and
       noVNC measures this element with clientWidth/clientHeight to compute the
       scale — containing its size is asking the thing that must be measured not
       to report its measurements. The compositing benefit comes from `paint`. */
    contain: layout paint;
  }
  #screen canvas {
    /* Bilinear rather than nearest: a scaled desktop is a photo, not pixel art,
       and `pixelated` makes downscaled text unreadable. */
    image-rendering: auto;
    transform: translateZ(0);
  }
  /* A hairline so the surface reads as an inset panel when it does not fill the
     viewport, instead of floating in an undifferentiated void. */
  #screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 1px var(--edge);
  }
  #status {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    padding: .55rem .9rem;
    border-radius: 6px;
    background: rgba(0, 0, 0, .35);
    color: #e8ecf2;
    letter-spacing: .01em;
    pointer-events: none;
    opacity: 0; transition: opacity .18s ease;
    z-index: 5;
  }
  #status[data-show="1"] { opacity: 1; }

  /* The toast: a glass pill at the bottom, on the pane's material. */
  #toast {
    position: absolute; left: 50%; bottom: 22px; z-index: 20;
    transform: translateX(-50%);
    max-width: 78%; padding: 7px 14px; border-radius: 999px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(16px) saturate(1.3);
    backdrop-filter: blur(16px) saturate(1.3);
    border: 1px solid var(--glass-line);
    color: var(--ink); font-size: 12px;
    opacity: 0; transition: opacity .18s ease; pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #toast[data-show="1"] { opacity: 1; }
</style>

<div id="pane" hidden></div>
<div id="page"></div>
<div id="screen" hidden></div>
<div id="status">connecting…</div>
<div id="toast"></div>

<script type="module">
import RFB from './core/rfb.js';

const q = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseInt(q.get(k), 10); return Number.isFinite(v) ? v : d; };

const matte = q.get('bg');
if (matte) document.documentElement.style.setProperty('--matte', '#' + matte.replace(/^#/, ''));

const paneEl = document.getElementById('pane');
const pageEl = document.getElementById('page');
const screenEl = document.getElementById('screen');
const statusEl = document.getElementById('status');
const toastEl = document.getElementById('toast');

let toastTimer = 0;
const toast = (text) => {
  toastEl.textContent = text;
  toastEl.dataset.show = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.dataset.show = '0'; }, 3200);
};

// ── The control plane ───────────────────────────────────────────────────────
// The bridge (this origin) serves only static files and the websocket; every
// machine-level fact — what is connected, what the viewport should show, what
// the toggles say — belongs to the daemon's control endpoint. Its URL is
// published beside this page as control.json by the Python side, so the
// sidebar needs no parameters at all: the starting page is the startpage.
let control = q.get('control') || '';
async function controlBase() {
  if (control) return control;
  try {
    const r = await fetch('./control.json?t=' + Date.now());
    if (r.ok) control = (await r.json()).control || '';
  } catch (_) { /* served without a daemon beside us */ }
  return control;
}

// ── Router ──────────────────────────────────────────────────────────────────
// #/           the SIDEBAR: glass pane of controls + machine rows
// #/m/<id>     the VIEWPORT: the machine's desktop, bare; it follows the
//              daemon's active-machine pointer and its viewer prefs
const viewParam = () => new URLSearchParams((location.hash.split('?')[1] || ''));
const machineId = () => decodeURIComponent((location.hash.match(/^#\/m\/([^?]+)/) || [])[1] || '');

let rfb = null;
let retry = 0;
let settled = false;
let tickTimer = 0;
let slowTick = 0;
const say = (text, show) => { statusEl.textContent = text; statusEl.dataset.show = show ? '1' : '0'; };

function stopTicks() { clearInterval(tickTimer); clearInterval(slowTick); tickTimer = slowTick = 0; }

const ICONS = {
  camera: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 4.5h2l1-1.5h5l1 1.5h2v7h-11z"/><circle cx="7" cy="7.8" r="2.2"/></svg>',
  refresh: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7a5 5 0 1 1-1.5-3.6M12 1.5V4h-2.5"/></svg>',
  open: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2h-2v8h8V8"/><path d="M7 2h3v3M10 2 5.5 6.5"/></svg>',
};

async function post(path, body) {
  const base = await controlBase();
  if (!base) throw new Error('no control endpoint');
  const r = await fetch(base + path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  return { ok: r.ok, body: await r.json().catch(() => ({})) };
}

// ── Shared session plumbing (the viewport's engine) ─────────────────────────
function destroyRfb() {
  if (rfb) { try { rfb.disconnect(); } catch (_) {} rfb = null; }
}

function applyScaling(on) {
  if (!rfb) return;
  // Re-asserting `scaleViewport` is the supported way to force the recompute;
  // two frames, because the first can still read the pre-layout box.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    try { rfb.scaleViewport = on; } catch (_) { /* torn down mid-resize */ }
  }));
}

function connectRfb(wsPort) {
  destroyRfb();
  settled = false; retry = 0;
  // The bridge port comes from the daemon's active pointer (or the deep link
  // that announced this surface), never guessed from this page's own origin:
  // the page can outlive the bridge that first served it.
  const wsBase = wsPort
    ? `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.hostname}:${wsPort}`
    : location.origin;

  rfb = new RFB(screenEl, wsBase + '/websockify', {});

  // ── The geometry contract, in three lines ────────────────────────────────
  // scaleViewport: the viewer scales itself to whatever window it is given
  //   (auto-scaling, the operator's default; the sidebar's toggle trades it
  //   for 1:1 pixels). resizeSession: NEVER — a viewer that renegotiates the
  //   surface has silently converted --scaled into --adopt and invalidated
  //   the agent's coordinates. clipViewport: off, or a surface larger than
  //   the window would scroll instead of scaling.
  rfb.scaleViewport = viewer.scaling;
  rfb.resizeSession = false;
  rfb.clipViewport = false;

  rfb.qualityLevel = num('quality', 9);
  rfb.compressionLevel = num('compression', 0);
  rfb.showDotCursor = q.get('dot') !== '0';
  rfb.viewOnly = !viewer.keyboard;
  rfb.background = 'transparent';
  rfb.focusOnClick = true;

  rfb.addEventListener('connect', () => {
    settled = true; retry = 0;
    say('', false);
    if (viewer.keyboard) rfb.focus();
  });

  rfb.addEventListener('disconnect', (e) => {
    const clean = e.detail && e.detail.clean;
    // Exponential-ish backoff, capped: the bridge dies and restarts when a
    // session is repinned, and hammering it during that window just fills the
    // log with refusals.
    retry = Math.min(retry + 1, 10);
    const wait = Math.min(250 * retry, 2000);
    say(clean && settled ? 'reconnecting…' : 'connecting…', true);
    setTimeout(() => { if (machineId() === viewing) connectRfb(viewer.ws); }, wait);
  });

  // A console with no auth still fires this if a target ever grows one; answering
  // with nothing is better than a blocking prompt nobody can see.
  rfb.addEventListener('credentialsrequired', () => rfb.sendCredentials({ password: '' }));

  say('connecting…', true);
}

// The viewport's local mirror of the daemon's active pointer. Server truth,
// applied locally: the sidebar writes, the daemon arbitrates, we follow.
const viewer = { keyboard: true, scaling: true, ws: 0 };
let viewing = '';

async function renderViewport(id, wsParam) {
  document.body.dataset.view = 'session';
  paneEl.hidden = true;
  pageEl.hidden = true;
  screenEl.hidden = false;
  viewing = id;
  viewer.ws = Number(wsParam) || 0;

  // Announce ourselves as the active machine — a fresh reveal wins, the same
  // input-switching rule a row click follows — and pick up the machine's
  // stored prefs plus its canonical machine id in one round trip.
  try {
    const { ok, body } = await post('/api/active', { target: id, web_port: viewer.ws });
    if (ok && body.target) {
      if (body.target !== id) {
        // The daemon normalises app targets (pl9) to their machine (win0);
        // follow the canonical name so the follow-loop compares apples.
        location.replace(`#/m/${body.target}?ws=${body.web_port || viewer.ws || ''}`);
        return;
      }
      if (body.web_port && !viewer.ws) viewer.ws = body.web_port;
      viewer.keyboard = body.prefs ? body.prefs.keyboard !== false : true;
      viewer.scaling = body.prefs ? body.prefs.scaling !== false : true;
    }
  } catch (_) { /* no daemon: the deep link's own ws still works */ }

  connectRfb(viewer.ws);

  // Follow the pointer: a row click elsewhere re-aims this viewport, a
  // re-attach moves us to the new bridge, a pref flip applies in place.
  stopTicks();
  tickTimer = setInterval(async () => {
    const base = await controlBase();
    if (!base) return;
    try {
      const a = await (await fetch(base + '/api/active')).json();
      if (!a.target) return;
      if (a.target !== viewing) {
        location.replace(`#/m/${a.target}${a.web_port ? '?ws=' + a.web_port : ''}`);
        return;
      }
      if (a.web_port && viewer.ws && a.web_port !== viewer.ws) {
        viewer.ws = a.web_port;
        connectRfb(viewer.ws);
        return;
      }
      if (a.web_port && !viewer.ws) { viewer.ws = a.web_port; connectRfb(viewer.ws); return; }
      const kb = a.prefs ? a.prefs.keyboard !== false : true;
      const sc = a.prefs ? a.prefs.scaling !== false : true;
      if (kb !== viewer.keyboard) {
        viewer.keyboard = kb;
        if (rfb) { rfb.viewOnly = !kb; if (kb) { try { rfb.focus(); } catch (_) {} } }
      }
      if (sc !== viewer.scaling) { viewer.scaling = sc; applyScaling(sc); }
    } catch (_) { /* the daemon blinks; keep showing what we have */ }
  }, 1000);
}

// ── The sidebar: the remote control ─────────────────────────────────────────
let machinesCache = [];
let activeCache = { target: null, epoch: 0, prefs: {} };
let machinesJson = '[]';
let rowsDirty = true;

function toggleControl(label, key) {
  const b = document.createElement('button');
  b.className = 'toggle'; b.dataset.pref = key;
  const span = document.createElement('span'); span.textContent = label;
  const sw = document.createElement('span'); sw.className = 'switch';
  const th = document.createElement('span'); th.className = 'thumb';
  sw.appendChild(th); b.appendChild(span); b.appendChild(sw);
  b.addEventListener('click', async () => {
    if (!activeCache.target) return;
    const next = !(activeCache.prefs ? activeCache.prefs[key] !== false : true);
    b.setAttribute('aria-pressed', String(next)); // optimistic; the poll confirms
    try {
      const { ok, body } = await post('/api/state', { [key]: next });
      if (ok && body.target) { activeCache = body; drawPaneControls(); }
    } catch (e) { toast('the daemon refused that: ' + e.message); }
  });
  return b;
}

let shootBtn, kbToggle, scToggle;

function drawPane() {
  paneEl.hidden = false;
  paneEl.textContent = '';
  const row1 = document.createElement('div'); row1.className = 'pane-row';
  const t = document.createElement('span');
  t.className = 'pane-title';
  t.textContent = activeCache.target || 'yRDP';
  row1.appendChild(t);
  const sub = document.createElement('span');
  sub.className = 'pane-sub';
  sub.textContent = activeCache.target
    ? 'attached — the viewport follows this machine'
    : `${machinesCache.filter((m) => m.live).length} of ${machinesCache.length} connected`;
  row1.appendChild(sub);
  const refresh = document.createElement('button');
  refresh.className = 'icon-btn'; refresh.title = 'Refresh'; refresh.innerHTML = ICONS.refresh;
  refresh.addEventListener('click', refreshAll);
  row1.appendChild(refresh);
  paneEl.appendChild(row1);

  const row2 = document.createElement('div'); row2.className = 'pane-row controls';
  shootBtn = document.createElement('button');
  shootBtn.className = 'icon-btn'; shootBtn.title = 'Screenshot (downloads a PNG)';
  shootBtn.innerHTML = ICONS.camera;
  shootBtn.addEventListener('click', shoot);
  kbToggle = toggleControl('Keyboard', 'keyboard');
  scToggle = toggleControl('Scaling', 'scaling');
  row2.appendChild(shootBtn); row2.appendChild(kbToggle); row2.appendChild(scToggle);
  paneEl.appendChild(row2);
  drawPaneControls();
}

function drawPaneControls() {
  const on = !!activeCache.target;
  shootBtn.disabled = !on; kbToggle.disabled = !on; scToggle.disabled = !on;
  const p = activeCache.prefs || {};
  kbToggle.setAttribute('aria-pressed', String(p.keyboard !== false));
  scToggle.setAttribute('aria-pressed', String(p.scaling !== false));
}

async function shoot() {
  if (!activeCache.target) { toast('nothing is attached'); return; }
  try {
    const base = await controlBase();
    const r = await fetch(base + '/api/screenshot', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ target: activeCache.target }),
    });
    if (!r.ok) { toast((await r.json().catch(() => ({}))).error || 'screenshot failed'); return; }
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `yrdp-${activeCache.target}-${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('screenshot saved');
  } catch (e) { toast('screenshot failed: ' + e.message); }
}

function row(m, connected) {
  const b = document.createElement('button');
  b.className = 'machine-row';
  b.type = 'button';
  if (activeCache.target === m.id) b.dataset.active = '1';
  const mark = document.createElement('span');
  mark.className = 'mark';
  mark.textContent = (m.title || m.id || '?').trim().charAt(0).toUpperCase() || '?';
  const mid = document.createElement('span');
  const t = document.createElement('div'); t.className = 'm-title'; t.textContent = m.title;
  const s = document.createElement('div'); s.className = 'm-sub'; s.textContent = m.subtitle || '';
  mid.appendChild(t); mid.appendChild(s);
  const chip = document.createElement('span');
  chip.className = 'chip';
  chip.textContent = connected ? 'live' : (m.protocol || '').toUpperCase() || 'open';
  if (connected) chip.dataset.live = '1';
  b.appendChild(mark); b.appendChild(mid); b.appendChild(chip);
  // The row is the remote control: it aims the viewport. The chevron is the
  // one way in for a copy of this page that has no viewport beside it.
  if (connected && m.web_port) {
    const open = document.createElement('span');
    open.className = 'open-here'; open.title = 'Open this desktop here';
    open.innerHTML = ICONS.open;
    open.addEventListener('click', (e) => {
      e.stopPropagation();
      location.hash = `#/m/${encodeURIComponent(m.id)}?ws=${m.web_port}`;
    });
    b.appendChild(open);
  }
  b.addEventListener('click', () => pick(m));
  return b;
}

function emptyState(lead, hint) {
  const d = document.createElement('div');
  d.className = 'empty';
  const b = document.createElement('b'); b.textContent = lead;
  const s = document.createElement('span'); s.textContent = hint;
  d.appendChild(b); d.appendChild(s);
  return d;
}

function groupLabel(text) {
  const d = document.createElement('div');
  d.className = 'group-label'; d.textContent = text;
  return d;
}

async function pick(m) {
  if (m.live) {
    // Aim the viewport; the sidebar stays a sidebar.
    try {
      const { ok, body } = await post('/api/active', { target: m.id });
      if (ok && body.target) {
        activeCache = body;
        drawPane(); // the title names the machine now attached
        refresh();
      }
    } catch (e) { toast('the daemon refused that: ' + e.message); }
    return;
  }
  try {
    const { body } = await post('/api/open', { target: m.id });
    if (body.error || !body.request) { toast(body.error || 'the daemon refused the connect'); return; }
    toast('connecting to ' + m.title + '…');
    const deadline = Date.now() + 65000;
    const poll = async () => {
      const base = await controlBase();
      const w = await fetch(base + '/api/open/' + encodeURIComponent(body.request));
      const st = await w.json();
      if (st.status === 'ready') { refresh(); toast(m.title + ' is up — the viewport is on it'); return; }
      if (st.status === 'failed') { toast('connect failed — ' + st.error); refresh(); return; }
      if (Date.now() > deadline) { toast('still connecting — the row will show state'); refresh(); return; }
      setTimeout(poll, 800);
    };
    poll();
  } catch (e) { toast('connect failed: ' + e.message); }
}

function renderSidebar() {
  document.body.dataset.view = 'start';
  screenEl.hidden = true; statusEl.dataset.show = '0';
  pageEl.hidden = false;
  drawPane();
  drawRows();
}

function drawRows() {
  pageEl.textContent = '';
  const live = machinesCache.filter((m) => m.live);
  const rest = machinesCache.filter((m) => !m.live);
  if (live.length) {
    pageEl.appendChild(groupLabel('Connected'));
    const wrap = document.createElement('div'); wrap.className = 'rows';
    live.forEach((m) => wrap.appendChild(row(m, true)));
    pageEl.appendChild(wrap);
  }
  if (rest.length) {
    pageEl.appendChild(groupLabel(live.length ? 'Available' : 'Machines'));
    const wrap = document.createElement('div'); wrap.className = 'rows';
    rest.forEach((m) => wrap.appendChild(row(m, false)));
    pageEl.appendChild(wrap);
  }
  if (!machinesCache.length) {
    const hasControl = !!control;
    pageEl.appendChild(emptyState(
      hasControl ? 'No machines yet.' : 'No control endpoint.',
      hasControl
        ? 'Point YRDP_TARGETS_DIR at a store of *.toml targets, then refresh.'
        : 'This page was served without the daemon beside it. Open it through `yrdp pick` or `yrdp view`.',
    ));
  }
}

async function refreshAll() {
  const base = await controlBase();
  if (base) {
    try {
      const [m, a] = await Promise.all([
        fetch(base + '/api/machines'),
        fetch(base + '/api/active'),
      ]);
      if (m.ok) {
        const next = await m.json();
        // Rebuild the rows only when a row actually changed: a wholesale
        // redraw every poll replaces the DOM under the user's cursor — hover
        // dies, and a click that resolved one build lands on the next.
        const nextJson = JSON.stringify(next);
        if (nextJson !== machinesJson) { machinesCache = next; machinesJson = nextJson; rowsDirty = true; }
      }
      if (a.ok) {
        const next = await a.json();
        if ((next.epoch || 0) !== (activeCache.epoch || 0) || next.target !== activeCache.target) {
          activeCache = next;
          drawPane();
          rowsDirty = true; // the active highlight lives on the rows
        } else {
          activeCache = next;
          drawPaneControls();
          if (!next.target) drawPane();
        }
      }
    } catch (_) { /* keep the last good lists */ }
  }
  if (rowsDirty) { drawRows(); rowsDirty = false; }
}

let pollTimer = 0;
function route() {
  stopTicks(); clearTimeout(pollTimer);
  const id = machineId();
  if (id) {
    renderViewport(id, viewParam().get('ws'));
    return;
  }
  destroyRfb();
  renderSidebar();
  refreshAll();
  // The sidebar polls cheaply: the active pointer every second (so a toggle
  // lands within a breath), the machine list every five.
  let n = 0;
  pollTimer = setInterval(async () => {
    n += 1;
    const base = await controlBase();
    if (!base) return;
    let changed = false;
    try {
      const a = await fetch(base + '/api/active');
      if (a.ok) {
        const next = await a.json();
        if ((next.epoch || 0) !== (activeCache.epoch || 0) || next.target !== activeCache.target) {
          activeCache = next;
          changed = true;
        } else {
          activeCache = next;
          drawPaneControls();
          // The count under the title reads the machine list; keep it honest
          // as rows come and go, even while nothing is attached.
          if (!next.target) drawPane();
        }
      }
    } catch (_) {}
    if (changed) { drawPane(); drawRows(); }
    else if (n % 5 === 0) refreshAll();
  }, 1000);
}
window.addEventListener('hashchange', route);
route();

// A window onto the page's state — for the console when something looks
// wrong, and for tests that need to see inside the module.
window.__yrdp = {
  get viewer() { return viewer; },
  get viewing() { return viewing; },
  get rfb() { return rfb; },
  get active() { return activeCache; },
  get machines() { return machinesCache; },
};

// ── Rescale when the VIEWPORT changes, not just when the window does ────────
// noVNC observes the container itself, but `_handleResize` early-returns when
// the size it reads still matches the size it last recorded — and a yggterm
// surface is resized by the HOST (collapsing the cwd tree, toggling the rail),
// which can deliver the observation before layout has settled. The surface then
// keeps its old scale and the new space becomes matte: exactly the "I hid my
// cwd tree and got extra black bar padding" report.
const rescale = () => { if (rfb) applyScaling(viewer.scaling); };
new ResizeObserver(rescale).observe(document.getElementById('screen'));
window.addEventListener('resize', rescale);
// A surface the host hid and re-showed can come back at a different size while
// no resize event fired at all; re-assert whenever we become visible again.
document.addEventListener('visibilitychange', () => { if (!document.hidden) rescale(); });

// Refocus on click even after the surface has been backgrounded and rehidden by
// the host — the webview keeps the DOM but not always the focus ring.
window.addEventListener('mousedown', (e) => {
  if (rfb && viewer.keyboard && !paneEl.contains(e.target)) { try { rfb.focus(); } catch (_) {} }
});
</script>
