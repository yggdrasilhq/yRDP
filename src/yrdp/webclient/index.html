<!doctype html>
<!--
  yRDP's own viewer — the HUMAN half of the dual-viewport contract.

  This exists instead of noVNC's stock `vnc.html` for one structural reason and
  several cosmetic ones. The structural one: `vnc.html` ships a control bar, a
  settings drawer and a connect dialog, all of which can RESIZE THE SESSION.
  `resizeSession` is a user-visible toggle there, and a human who flips it turns
  a `--scaled` attach into an `--adopt` silently, invalidating every coordinate
  the agent lane holds. Here the SetDesktopSize pseudo-encoding is never
  advertised at all, so the far end cannot be resized by a viewer even in
  principle — the geometry contract is enforced by omission, which is the only
  way it stays enforced (docs/agent-surface-attachment.md §3).

  THE SHAPE (2026-09-21, the operator's directive): this is a complex sidebar
  in the ydesign sense (hairline rows, never cards; identity marks with an
  inset ring and a letter fallback; quiet chips; a left-rule empty state), not
  a bare canvas. The STARTING PAGE is the startpage: the machines that are
  connected, one row each, named after the machine. Picking a row opens the
  session view under a glass pane (frosted, blurred, over the content) that
  carries the human controls: screenshot, keyboard passthrough, auto-scaling.
  The pane floats OVER the surface — it never takes space from it, and none of
  its controls ever renegotiate the framebuffer.

  Everything is driven by query parameters so that one file serves every target
  and the Python side owns the policy.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>yRDP</title>
<style>
  /* The yggui base token family, as inherited through ydesign's chain. The
     startpage and pane are chrome and live on paper; the session backdrop
     stays the operator's matte (?bg=) so an unfilled viewport reads as an
     inset panel, not as a broken render. */
  :root {
    --paper: #f7f8f8;
    --ink: #24343b;
    --muted: #52666f;
    --accent: #265f63;
    --tint: color-mix(in srgb, var(--accent) 8%, var(--paper));
    --line: color-mix(in srgb, var(--accent) 23%, var(--paper));
    --control-line: color-mix(in srgb, var(--muted) 48%, var(--paper));
    --mark: color-mix(in srgb, var(--accent) 14%, var(--paper));
    /* Overridden from ?bg= so the matte matches the operator's terminal theme
       rather than announcing itself as a different application. */
    --matte: #262a33;
    --edge: rgba(255, 255, 255, .06);
    /* The glass: the pane treatment — a barely-there tint over real blur.
       Frosted LIGHT, so it stays readable over both a bright desktop and the
       dark matte, and it reads as the sidebar's own chrome, not an overlay. */
    --glass: rgba(252, 252, 252, .72);
    --glass-line: rgba(36, 52, 59, .12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--paper);
    overflow: hidden;
    /* The viewer is a viewport, not a document: no rubber-banding, no
       accidental text selection when a drag misses the canvas. */
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    font: 13px/1.5 system-ui, sans-serif;
    color: var(--ink);
  }
  body[data-view="session"] { background: var(--matte); }

  /* ── The glass pane ───────────────────────────────────────────────────── */
  #pane {
    position: absolute; inset: 0 0 auto 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    min-height: 46px; padding: 6px 12px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(16px) saturate(1.3);
    backdrop-filter: blur(16px) saturate(1.3);
    border-bottom: 1px solid var(--glass-line);
  }
  #pane .pane-title { font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
  #pane .pane-sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pane .spacer { flex: 1; }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; flex: none;
    border: 1px solid var(--control-line); border-radius: 8px;
    background: transparent; color: var(--ink);
    font: inherit; cursor: pointer; padding: 0;
  }
  .icon-btn:hover { background: var(--tint); border-color: var(--accent); }
  .icon-btn svg { display: block; }

  /* Toggle controls in the pane: a label plus a real switch. The switch is
     the yggui pattern — pill, round thumb, accent when pressed — and
     `aria-pressed` is the state, not a class name. */
  .toggle {
    display: inline-flex; align-items: center; gap: 7px;
    height: 30px; padding: 0 10px 0 12px;
    border: 1px solid var(--control-line); border-radius: 8px;
    background: transparent; color: var(--ink);
    font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .toggle:hover { border-color: var(--accent); }
  .toggle .switch {
    display: inline-flex; align-items: center;
    width: 30px; height: 17px; padding: 2px; border-radius: 999px;
    background: color-mix(in srgb, var(--muted) 55%, var(--paper));
    transition: background .15s ease; flex: none;
  }
  .toggle .thumb {
    width: 13px; height: 13px; border-radius: 50%; background: var(--paper);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
    transition: transform .15s ease;
  }
  .toggle[aria-pressed="true"] .switch { background: var(--accent); }
  .toggle[aria-pressed="true"] .thumb { transform: translateX(13px); }

  /* Quiet 10px chips, the ydesign way: language AND position, never a badge. */
  .chip {
    font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); border: 1px solid var(--line);
    padding: 1px 7px; border-radius: 999px; white-space: nowrap;
  }
  .chip[data-live="1"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--paper)); }

  /* ── The startpage: a complex sidebar, rows over hairlines ────────────── */
  #page { position: absolute; inset: 0; overflow-y: auto; }
  .group-label {
    padding: 18px 16px 6px;
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted);
  }
  .rows { border-top: 1px solid var(--line); }
  .machine-row {
    display: grid; grid-template-columns: 32px 1fr auto; gap: 12px;
    align-items: center; padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer; background: transparent; width: 100%;
    font: inherit; text-align: left; color: inherit;
    border-left: none; border-right: none; border-top: none;
  }
  /* Rows separated by hairlines, never cards; hover is a tint, not a box. */
  .machine-row:hover { background: var(--tint); }
  .machine-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .mark {
    width: 32px; height: 32px; border-radius: 8px;
    display: grid; place-items: center;
    background: var(--mark);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent);
    color: var(--accent); font-weight: 700; font-size: 14px;
  }
  .machine-row .m-title { font-weight: 600; }
  .machine-row .m-sub {
    color: var(--muted); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* The empty state: a left-rule quiet block with a bolded first line and an
     escape route — kept context, not catastrophe. */
  .empty {
    margin: 26px 16px; padding: 4px 0 4px 14px;
    border-left: 3px solid var(--line);
  }
  .empty b { display: block; }
  .empty span { color: var(--muted); font-size: 12px; }

  /* ── The session surface ──────────────────────────────────────────────── */
  /* THE GPU PATH. The canvas noVNC paints into is scaled with a CSS transform,
     which WebKit promotes to a composited layer only if we ask plainly. Without
     these the scale is redone on the CPU every frame and a 1440x1200 surface
     visibly tears while dragging a window. */
  #screen {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    transform: translateZ(0);
    will-change: transform;
    backface-visibility: hidden;
    /* `layout paint`, NOT `strict`. `strict` also applies SIZE containment, and
       noVNC measures this element with clientWidth/clientHeight to compute the
       scale — containing its size is asking the thing that must be measured not
       to report its measurements. The compositing benefit comes from `paint`. */
    contain: layout paint;
  }
  #screen canvas {
    /* Bilinear rather than nearest: a scaled desktop is a photo, not pixel art,
       and `pixelated` makes downscaled text unreadable. */
    image-rendering: auto;
    transform: translateZ(0);
  }
  /* A hairline so the surface reads as an inset panel when it does not fill the
     viewport, instead of floating in an undifferentiated void. */
  #screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 1px var(--edge);
  }
  #status {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    padding: .55rem .9rem;
    border-radius: 6px;
    background: rgba(0, 0, 0, .35);
    color: #e8ecf2;
    letter-spacing: .01em;
    pointer-events: none;
    opacity: 0; transition: opacity .18s ease;
    z-index: 5;
  }
  #status[data-show="1"] { opacity: 1; }

  /* The toast: a glass pill at the bottom, on the pane's material. */
  #toast {
    position: absolute; left: 50%; bottom: 22px; z-index: 20;
    transform: translateX(-50%);
    max-width: 78%; padding: 7px 14px; border-radius: 999px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(16px) saturate(1.3);
    backdrop-filter: blur(16px) saturate(1.3);
    border: 1px solid var(--glass-line);
    color: var(--ink); font-size: 12px;
    opacity: 0; transition: opacity .18s ease; pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #toast[data-show="1"] { opacity: 1; }
</style>

<div id="pane" hidden></div>
<div id="page"></div>
<div id="screen" hidden></div>
<div id="status">connecting…</div>
<div id="toast"></div>

<script type="module">
import RFB from './core/rfb.js';

const q = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseInt(q.get(k), 10); return Number.isFinite(v) ? v : d; };

const matte = q.get('bg');
if (matte) document.documentElement.style.setProperty('--matte', '#' + matte.replace(/^#/, ''));

const paneEl = document.getElementById('pane');
const pageEl = document.getElementById('page');
const screenEl = document.getElementById('screen');
const statusEl = document.getElementById('status');
const toastEl = document.getElementById('toast');

let toastTimer = 0;
const toast = (text) => {
  toastEl.textContent = text;
  toastEl.dataset.show = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.dataset.show = '0'; }, 3200);
};

// ── The control plane ───────────────────────────────────────────────────────
// The bridge (this origin) serves only static files and the websocket; every
// machine-level fact — what is connected, how to start one, screenshots —
// belongs to the daemon's control endpoint. Its URL is published beside this
// page as control.json by the Python side, so the startpage needs no
// parameters at all: the starting page is the startpage.
let control = q.get('control') || '';
async function controlBase() {
  if (control) return control;
  try {
    const r = await fetch('./control.json?t=' + Date.now());
    if (r.ok) control = (await r.json()).control || '';
  } catch (_) { /* served without a daemon beside us */ }
  return control;
}

// ── Router ──────────────────────────────────────────────────────────────────
// #/           the startpage
// #/m/<id>     one machine's session view (ws=<bridge port> pins the socket)
const viewParam = () => new URLSearchParams((location.hash.split('?')[1] || ''));
const machineId = () => decodeURIComponent((location.hash.match(/^#\/m\/([^?]+)/) || [])[1] || '');

let rfb = null;
let retry = 0;
let settled = false;
const say = (text, show) => { statusEl.textContent = text; statusEl.dataset.show = show ? '1' : '0'; };

// Human controls, pane-scoped state. Defaults follow the contract: scaled to
// fit, keyboard live. Neither ever resizes the far end — the toggles change
// only THIS window's relationship to a framebuffer nobody renegotiates.
const controls = { keyboard: true, scaling: true };

const ICONS = {
  back: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.5 4.5 7 9 11.5"/></svg>',
  camera: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 4.5h2l1-1.5h5l1 1.5h2v7h-11z"/><circle cx="7" cy="7.8" r="2.2"/></svg>',
  refresh: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7a5 5 0 1 1-1.5-3.6M12 1.5V4h-2.5"/></svg>',
};

function renderPane({ title, sub, back, right = [] } = {}) {
  paneEl.hidden = false;
  paneEl.textContent = '';
  if (back) {
    const b = document.createElement('button');
    b.className = 'icon-btn'; b.title = 'Back to startpage'; b.innerHTML = ICONS.back;
    b.addEventListener('click', () => { location.hash = '#/'; });
    paneEl.appendChild(b);
  }
  const t = document.createElement('div');
  t.style.cssText = 'display:flex;align-items:baseline;gap:8px;min-width:0;overflow:hidden;';
  const titleEl = document.createElement('span');
  titleEl.className = 'pane-title'; titleEl.textContent = title;
  t.appendChild(titleEl);
  if (sub) {
    const subEl = document.createElement('span');
    subEl.className = 'pane-sub'; subEl.textContent = sub;
    t.appendChild(subEl);
  }
  paneEl.appendChild(t);
  paneEl.appendChild(Object.assign(document.createElement('div'), { className: 'spacer' }));
  for (const el of right) paneEl.appendChild(el);
}

function toggleButton(label, key, onChange) {
  const b = document.createElement('button');
  b.className = 'toggle';
  b.setAttribute('aria-pressed', String(controls[key]));
  const span = document.createElement('span'); span.textContent = label;
  const sw = document.createElement('span'); sw.className = 'switch';
  const th = document.createElement('span'); th.className = 'thumb';
  sw.appendChild(th); b.appendChild(span); b.appendChild(sw);
  b.addEventListener('click', () => {
    controls[key] = !controls[key];
    b.setAttribute('aria-pressed', String(controls[key]));
    onChange(controls[key]);
  });
  return b;
}

function shootButton(target) {
  const b = document.createElement('button');
  b.className = 'icon-btn'; b.title = 'Screenshot (downloads a PNG)'; b.innerHTML = ICONS.camera;
  b.addEventListener('click', async () => {
    const base = await controlBase();
    if (!base) { toast('no control endpoint — cannot screenshot'); return; }
    try {
      const r = await fetch(base + '/api/screenshot', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target }),
      });
      if (!r.ok) { toast((await r.json().catch(() => ({}))).error || 'screenshot failed'); return; }
      const blob = await r.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `yrdp-${target}-${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast('screenshot saved');
    } catch (e) { toast('screenshot failed: ' + e.message); }
  });
  return b;
}

// ── The session view ────────────────────────────────────────────────────────
function destroyRfb() {
  if (rfb) { try { rfb.disconnect(); } catch (_) {} rfb = null; }
}

function applyScaling(on) {
  if (!rfb) return;
  // Re-asserting `scaleViewport` is the supported way to force the recompute;
  // two frames, because the first can still read the pre-layout box.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    try { rfb.scaleViewport = on; } catch (_) { /* torn down mid-resize */ }
  }));
}

function openSession(id, wsPort) {
  destroyRfb();
  settled = false; retry = 0;
  // The bridge port comes from the row (the daemon knows where each session's
  // exporter is), never guessed from this page's own origin: the page can
  // outlive the bridge that first served it.
  const wsBase = wsPort
    ? `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.hostname}:${wsPort}`
    : location.origin;
  const wsUrl = wsBase + '/websockify';

  rfb = new RFB(screenEl, wsUrl, {});

  // ── The geometry contract, in three lines ────────────────────────────────
  // scaleViewport: the viewer scales itself to whatever window it is given
  //   (auto-scaling, the operator's default; the pane toggle trades it for 1:1
  //   pixels). resizeSession: NEVER — a viewer that renegotiates the surface
  //   has silently converted --scaled into --adopt and invalidated the agent's
  //   coordinates. clipViewport: off, or a surface larger than the window
  //   would scroll instead of scaling.
  rfb.scaleViewport = controls.scaling;
  rfb.resizeSession = false;
  rfb.clipViewport = false;

  rfb.qualityLevel = num('quality', 9);
  rfb.compressionLevel = num('compression', 0);
  rfb.showDotCursor = q.get('dot') !== '0';
  rfb.viewOnly = !controls.keyboard;
  rfb.background = 'transparent';
  rfb.focusOnClick = true;

  rfb.addEventListener('connect', () => {
    settled = true; retry = 0;
    say('', false);
    // Keyboard input goes to whichever element has focus; take it back from
    // the pane controls as soon as there is something to type into.
    if (controls.keyboard) rfb.focus();
  });

  rfb.addEventListener('disconnect', (e) => {
    const clean = e.detail && e.detail.clean;
    // Exponential-ish backoff, capped: the bridge dies and restarts when a
    // session is repinned, and hammering it during that window just fills the
    // log with refusals.
    retry = Math.min(retry + 1, 10);
    const wait = Math.min(250 * retry, 2000);
    say(clean && settled ? 'reconnecting…' : 'connecting…', true);
    setTimeout(() => { if (machineId() === id) openSession(id, wsPort); }, wait);
  });

  // A console with no auth still fires this if a target ever grows one; answering
  // with nothing is better than a blocking prompt nobody can see.
  rfb.addEventListener('credentialsrequired', () => rfb.sendCredentials({ password: '' }));

  say('connecting…', true);
}

function renderSession(id, wsPort) {
  document.body.dataset.view = 'session';
  pageEl.hidden = true;
  screenEl.hidden = false;

  renderPane({
    title: id,
    back: true,
    right: [
      shootButton(id),
      toggleButton('Keyboard', 'keyboard', (on) => {
        if (!rfb) return;
        rfb.viewOnly = !on;
        if (on) { try { rfb.focus(); } catch (_) {} }
        toast(on ? 'keyboard passes through to the machine' : 'keyboard stays local (view only)');
      }),
      toggleButton('Scaling', 'scaling', (on) => {
        applyScaling(on);
        toast(on ? 'auto-scaling: the surface fits the sidebar' : 'auto-scaling off: 1:1 pixels');
      }),
    ],
  });
  openSession(id, wsPort);
}

// ── The startpage ───────────────────────────────────────────────────────────
let machinesCache = [];

function row(m, connected) {
  const b = document.createElement('button');
  b.className = 'machine-row';
  b.type = 'button';
  const mark = document.createElement('span');
  mark.className = 'mark';
  mark.textContent = (m.title || m.id || '?').trim().charAt(0).toUpperCase() || '?';
  const mid = document.createElement('span');
  const t = document.createElement('div'); t.className = 'm-title'; t.textContent = m.title;
  const s = document.createElement('div'); s.className = 'm-sub'; s.textContent = m.subtitle || '';
  mid.appendChild(t); mid.appendChild(s);
  const chip = document.createElement('span');
  chip.className = 'chip';
  chip.textContent = connected ? 'live' : (m.protocol || '').toUpperCase() || 'open';
  if (connected) chip.dataset.live = '1';
  b.appendChild(mark); b.appendChild(mid); b.appendChild(chip);
  b.addEventListener('click', () => pick(m));
  return b;
}

function emptyState(lead, hint) {
  const d = document.createElement('div');
  d.className = 'empty';
  const b = document.createElement('b'); b.textContent = lead;
  const s = document.createElement('span'); s.textContent = hint;
  d.appendChild(b); d.appendChild(s);
  return d;
}

function groupLabel(text) {
  const d = document.createElement('div');
  d.className = 'group-label'; d.textContent = text;
  return d;
}

async function pick(m) {
  if (m.live && m.web_port) {
    location.hash = `#/m/${encodeURIComponent(m.id)}?ws=${m.web_port}`;
    return;
  }
  const base = await controlBase();
  if (!base) { toast('no control endpoint — run `yrdp pick` or `yrdp view` beside the daemon'); return; }
  toast('connecting to ' + m.title + '…');
  try {
    const r = await fetch(base + '/api/open', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ target: m.id }),
    });
    const { request, error } = await r.json();
    if (error || !request) { toast(error || 'the daemon refused the connect'); return; }
    const deadline = Date.now() + 65000;
    const poll = async () => {
      const w = await fetch(base + '/api/open/' + encodeURIComponent(request));
      const st = await w.json();
      if (st.status === 'ready') {
        location.hash = `#/m/${encodeURIComponent(m.id)}?ws=${st.web_port}`;
        return;
      }
      if (st.status === 'failed') { toast('connect failed — ' + st.error); refresh(); return; }
      if (Date.now() > deadline) { toast('still connecting — the row will show state'); refresh(); return; }
      setTimeout(poll, 800);
    };
    poll();
  } catch (e) { toast('connect failed: ' + e.message); }
}

function renderStart(machines, hasControl) {
  document.body.dataset.view = 'start';
  screenEl.hidden = true; statusEl.dataset.show = '0';
  pageEl.hidden = false;
  pageEl.textContent = '';

  renderPane({
    title: 'yRDP',
    sub: `${machines.filter((m) => m.live).length} of ${machines.length} connected`,
    right: (() => {
      const b = document.createElement('button');
      b.className = 'icon-btn'; b.title = 'Refresh'; b.innerHTML = ICONS.refresh;
      b.addEventListener('click', refresh);
      return [b];
    })(),
  });

  const live = machines.filter((m) => m.live);
  const rest = machines.filter((m) => !m.live);
  if (live.length) {
    pageEl.appendChild(groupLabel('Connected'));
    const wrap = document.createElement('div'); wrap.className = 'rows';
    live.forEach((m) => wrap.appendChild(row(m, true)));
    pageEl.appendChild(wrap);
  }
  if (rest.length) {
    pageEl.appendChild(groupLabel(live.length ? 'Available' : 'Machines'));
    const wrap = document.createElement('div'); wrap.className = 'rows';
    rest.forEach((m) => wrap.appendChild(row(m, false)));
    pageEl.appendChild(wrap);
  }
  if (!machines.length) {
    pageEl.appendChild(emptyState(
      hasControl ? 'No machines yet.' : 'No control endpoint.',
      hasControl
        ? 'Point YRDP_TARGETS_DIR at a store of *.toml targets, then refresh.'
        : 'This page was served without the daemon beside it. Open it through `yrdp pick` or `yrdp view`.',
    ));
  }
}

async function refresh() {
  const base = await controlBase();
  if (!base) { renderStart(machinesCache, false); return; }
  try {
    const r = await fetch(base + '/api/machines');
    if (!r.ok) throw new Error('http ' + r.status);
    machinesCache = await r.json();
  } catch (_) { /* keep the last good list */ }
  renderStart(machinesCache, true);
}

let pollTimer = 0;
function route() {
  clearTimeout(pollTimer);
  const id = machineId();
  if (id) {
    renderSession(id, viewParam().get('ws'));
    return;
  }
  destroyRfb();
  renderStart(machinesCache, !!control);
  refresh();
  pollTimer = setTimeout(function again() { refresh(); pollTimer = setTimeout(again, 5000); }, 5000);
}
window.addEventListener('hashchange', route);
route();

// ── Rescale when the VIEWPORT changes, not just when the window does ────────
// noVNC observes the container itself, but `_handleResize` early-returns when
// the size it reads still matches the size it last recorded — and a yggterm
// surface is resized by the HOST (collapsing the cwd tree, toggling the rail),
// which can deliver the observation before layout has settled. The surface then
// keeps its old scale and the new space becomes matte: exactly the "I hid my
// cwd tree and got extra black bar padding" report.
const rescale = () => { if (rfb) applyScaling(controls.scaling); };
new ResizeObserver(rescale).observe(document.getElementById('screen'));
window.addEventListener('resize', rescale);
// A surface the host hid and re-showed can come back at a different size while
// no resize event fired at all; re-assert whenever we become visible again.
document.addEventListener('visibilitychange', () => { if (!document.hidden) rescale(); });

// Refocus on click even after the surface has been backgrounded and rehidden by
// the host — the webview keeps the DOM but not always the focus ring.
window.addEventListener('mousedown', (e) => {
  if (rfb && controls.keyboard && !paneEl.contains(e.target)) { try { rfb.focus(); } catch (_) {} }
});
</script>
